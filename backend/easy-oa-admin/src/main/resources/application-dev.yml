spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 库名写死，不读 MYSQL_* 环境变量（2026-11-19 约定：避免开发其他项目时
    # 残留的环境变量把本项目的库连错，如 easy_crm 事故）；密码仍走 local 配置/环境变量
    url: jdbc:mysql://127.0.0.1:3306/easy_oa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    # 密码不落仓库：由环境变量 MYSQL_PASSWORD 注入，
    # 或写在 gitignore 的 application-local.yml 里（profile: local，本地默认激活）
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      # Redis 用于微信扫码登录的一次性凭证（state / bindTicket）等短时效数据
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 密码不落仓库：由环境变量 REDIS_PASSWORD 注入，
      # 或写在 gitignore 的 application-local.yml 里（profile: local，本地默认激活）
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0

# SQL 日志由 logback 的 cn.easykits DEBUG 输出（日志实现走 SLF4J → Logback，不再用 StdOutImpl）

oa:
  wechat:
    # 微信扫码登录总开关；false 时前端隐藏入口、后端拒绝全部微信端点
    enabled: true
    # mock 模式：跳过微信 API，以固定测试身份联调全流程（申请到 AppID 后置 false）
    mock: true
    appid: ${OA_WECHAT_APPID:}
    secret: ${OA_WECHAT_SECRET:}
    redirect-uri: ${OA_WECHAT_REDIRECT_URI:http://localhost:5778/auth/wechat/callback}
    # OA 账号由管理员创建，禁止扫码自助注册
    allow-register: false
